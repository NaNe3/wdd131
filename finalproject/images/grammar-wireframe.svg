<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Grammar Page Wireframe</title>
  <desc id="desc">Wireframe layout showing filter panel and grammar table content.</desc>
  <rect width="900" height="600" fill="#ffffff" stroke="#222"/>
  <rect x="20" y="20" width="860" height="60" fill="#eaeaea" stroke="#444"/>
  <text x="40" y="56" font-family="Arial, sans-serif" font-size="20">Header + Navigation</text>
  <rect x="20" y="100" width="220" height="430" fill="#f3f3f3" stroke="#444"/>
  <text x="45" y="140" font-family="Arial, sans-serif" font-size="18">Filter Panel</text>
  <text x="45" y="170" font-family="Arial, sans-serif" font-size="14">- Conjugation / Declension</text>
  <text x="45" y="195" font-family="Arial, sans-serif" font-size="14">- Tense / Case</text>
  <text x="45" y="220" font-family="Arial, sans-serif" font-size="14">- Search</text>
  <rect x="260" y="100" width="620" height="60" fill="#f3f3f3" stroke="#444"/>
  <text x="285" y="138" font-family="Arial, sans-serif" font-size="18">Page Title + Controls</text>
  <rect x="260" y="180" width="620" height="220" fill="#fafafa" stroke="#444"/>
  <text x="285" y="300" font-family="Arial, sans-serif" font-size="18">Responsive Grammar Table</text>
  <rect x="260" y="420" width="620" height="110" fill="#f3f3f3" stroke="#444"/>
  <text x="285" y="485" font-family="Arial, sans-serif" font-size="18">Practice Question Area</text>
  <rect x="20" y="540" width="860" height="40" fill="#eaeaea" stroke="#444"/>
  <text x="40" y="566" font-family="Arial, sans-serif" font-size="16">Footer</text>
</svg>
