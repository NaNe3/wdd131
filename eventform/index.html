<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Ticket Form</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="ticketForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required>
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required>
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type" required>
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" required>
      </div>

      <div id="extraFieldContainer" class="field full" hidden>
        <label for="extraField" id="extraFieldLabel">Student I#</label>
        <input id="extraField" name="extraField" type="text" autocomplete="off">
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <section id="messages" aria-live="polite"></section>
    <section id="ticketOutput" aria-live="polite"></section>
  </main>
</body>
</html>
